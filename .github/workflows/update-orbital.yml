name: Update Orbital SVG

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:        # also manually triggerable from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update orbital SVG with real contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-orbital.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet assets/orbital.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — skipping commit so this run does not count as a contribution."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit if changed
        if: steps.check.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update orbital contribution data [skip ci]"
          file_pattern: assets/orbital.svg
          # Attribute to the bot, not github.actor. The action's default author is
          # "${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>",
          # which makes every run count as a contribution on the profile graph — and
          # that extra contribution changes the current month's count, so the next
          # run sees a real diff and commits again. Self-feeding daily commit loop.
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
